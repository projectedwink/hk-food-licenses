name: Daily KML Processing

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Libraries
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas geopandas fiona

      - name: Run Python Script
        run: python process_data.py

      - name: Inject Google Maps API Key
        run: |
          sed -i 's/GOOGLE_MAPS_KEY_PLACEHOLDER/${{ secrets.G_MAPS_KEY }}/g' index.html

      - name: Commit and Push
        run: |
          git config --global user.name "Github Bot"
          git config --global user.email "bot@github.com"
          git add data.json previous_data.geojson report.md index.html || true
          git commit -m "Auto update: $(date)" || exit 0
          # 拉取遠端最新變更以避免推送衝突
          git pull origin main --rebase
          git push
