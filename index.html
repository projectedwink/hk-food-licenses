<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>香港食物業處所每日地圖</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; height: 100vh; overflow: hidden; }
        #sidebar { width: 360px; padding: 20px; background: #ffffff; border-right: 1px solid #e0e0e0; overflow-y: auto; z-index: 1000; }
        #map { flex: 1; height: 100%; width: 100%; }
        .info-card { background: #f8f9fa; padding: 15px; border-radius: 8px; border: 1px solid #e9ecef; margin-bottom: 20px; font-size: 14px; line-height: 1.6; }
        .info-card h3 { margin-bottom: 10px; color: #1a73e8; font-size: 16px; }
        .filter-group { margin-bottom: 15px; }
        .filter-group label { display: block; font-weight: bold; margin-bottom: 6px; font-size: 13px; color: #333; }
        .filter-group select { width: 100%; padding: 8px 10px; border-radius: 6px; border: 1px solid #ccc; font-size: 13px; background-color: #fff; }
        .badge { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; color: white; }
        .bg-new { background-color: #2e7d32; }
        .bg-existing { background-color: #1976d2; }
    </style>
</head>
<body>

<div id="sidebar">
    <div id="report-container" class="info-card">
        <h3>載入報告中...</h3>
    </div>

    <!-- 1. 按地區篩選 -->
    <div class="filter-group">
        <label for="districtSelect">📍 按地區分類 (SEARCH01_TC)</label>
        <select id="districtSelect" onchange="filterMarkers()">
            <option value="ALL">全部地區 (All Districts)</option>
        </select>
    </div>

    <!-- 2. 按牌照類別篩選 -->
    <div class="filter-group">
        <label for="categorySelect">🍽️ 按牌照類別分類 (NAME_TC)</label>
        <select id="categorySelect" onchange="filterMarkers()">
            <option value="ALL">全部類別 (All Categories)</option>
        </select>
    </div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    let map;
    let markerLayerGroup = L.layerGroup();
    let allMarkers = [];

    map = L.map('map').setView([22.3193, 114.1694], 11);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    markerLayerGroup.addTo(map);

    fetch('report.md')
        .then(res => res.text())
        .then(text => {
            document.getElementById('report-container').innerHTML = text.replace(/\n/g, '<br>');
        }).catch(() => {});

    fetch('data.json')
        .then(res => res.json())
        .then(data => {
            populateDropdowns(data);
            renderMarkers(data.features);
        });

    // 自動填入「地區」與「類別」兩個選單
    function populateDropdowns(data) {
        const districts = new Set();
        const categories = new Set();

        data.features.forEach(f => {
            if (f.properties.district) districts.add(f.properties.district);
            if (f.properties.license_type) categories.add(f.properties.license_type);
        });

        const districtSelect = document.getElementById("districtSelect");
        Array.from(districts).sort().forEach(dist => {
            const opt = document.createElement("option");
            opt.value = dist;
            opt.textContent = dist;
            districtSelect.appendChild(opt);
        });

        const categorySelect = document.getElementById("categorySelect");
        Array.from(categories).sort().forEach(cat => {
            const opt = document.createElement("option");
            opt.value = cat;
            opt.textContent = cat;
            categorySelect.appendChild(opt);
        });
    }

    function renderMarkers(features) {
        markerLayerGroup.clearLayers();
        allMarkers = [];

        features.forEach(feature => {
            const props = feature.properties;
            const coords = feature.geometry.coordinates;
            const isNew = props.status === 'NEW';

            const marker = L.circleMarker([coords[1], coords[0]], {
                radius: 6,
                fillColor: isNew ? "#2e7d32" : "#1976d2",
                color: "#ffffff",
                weight: 1,
                opacity: 1,
                fillOpacity: 0.8
            });

            marker.district = props.district;
            marker.licenseType = props.license_type;

            const popupContent = `
                <div style="font-size:13px; line-height:1.6; max-width:270px;">
                    <h3 style="margin:0 0 6px 0; color:#1a73e8;">${props.Name}</h3>
                    <p><b>牌照號碼：</b> ${props.license_no || 'N/A'}</p>
                    <p><b>類別：</b> ${props.license_type}</p>
                    <p><b>地區：</b> ${props.district || '未分類'}</p>
                    <p><b>地址：</b> ${props.address || '無地址資訊'}</p>
                    <p><b>到期日：</b> <b style="color:#d32f2f;">${props.expiry_date || 'N/A'}</b></p>
                    <p><b>更新日：</b> ${props.last_update || 'N/A'}</p>
                    <div style="margin-top:6px;">
                        <span class="badge ${isNew ? 'bg-new' : 'bg-existing'}">
                            ${isNew ? '🟢 今日新增' : '🔵 既有處所'}
                        </span>
                    </div>
                </div>
            `;

            marker.bindPopup(popupContent);
            markerLayerGroup.addLayer(marker);
            allMarkers.push(marker);
        });
    }

    // 雙重選單篩選邏輯 (AND 條件)
    function filterMarkers() {
        const selectedDistrict = document.getElementById("districtSelect").value;
        const selectedCategory = document.getElementById("categorySelect").value;

        markerLayerGroup.clearLayers();

        allMarkers.forEach(marker => {
            const matchDistrict = (selectedDistrict === "ALL" || marker.district === selectedDistrict);
            const matchCategory = (selectedCategory === "ALL" || marker.licenseType === selectedCategory);

            if (matchDistrict && matchCategory) {
                markerLayerGroup.addLayer(marker);
            }
        });
    }
</script>
</body>
</html>
